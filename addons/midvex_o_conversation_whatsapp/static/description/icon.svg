<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B4B9E"/>
      <stop offset="1" stop-color="#3D3270"/>
    </linearGradient>
  </defs>

  <!-- The conversation foundry's two-bubble glyph, with the outbound bubble in
       WhatsApp green instead of the house accent. Adapter modules are variants
       of the foundry they plug into, and the card should say so at a glance. -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <g fill="#FFFFFF">
    <rect x="30" y="48" width="136" height="96" rx="24"/>
    <polygon points="58,142 44,182 96,142"/>
  </g>
  <g fill="#3D3270">
    <circle cx="66" cy="90" r="11"/>
    <circle cx="98" cy="90" r="11"/>
    <circle cx="130" cy="90" r="11"/>
  </g>

  <!-- Filled and stroked in the background colour first, so the overlap with
       the white bubble reads as a gap rather than two shapes touching. -->
  <g fill="#3D3270" stroke="#3D3270" stroke-width="14" stroke-linejoin="round">
    <rect x="106" y="112" width="124" height="88" rx="24"/>
    <polygon points="200,198 212,232 160,198"/>
  </g>
  <g fill="#25D366">
    <rect x="106" y="112" width="124" height="88" rx="24"/>
    <polygon points="200,198 212,232 160,198"/>
  </g>
</svg>
